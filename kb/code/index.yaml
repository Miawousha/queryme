# Code section index.
#
# Canonical tag registry + optional bulk tag assignments. Per-repo `.md`
# frontmatter `tags: [...]` wins when present; assignments here fill in
# tags for repos whose frontmatter omits them.
#
# Validation: any tag value in a code entry's frontmatter that isn't a key
# under `tags:` below will fail the build. This is deliberate — typos
# (e.g. "type-script" vs "typescript") are the main thing this catches.
#
# To allow a new tag: add a key under `tags:` with a one-line definition,
# then use it.

tags:
  # ----- Domain -----
  ai:           AI / ML / LLM systems
  agent:        AI agent or autonomous system
  battery:      Battery management, monitoring, modelling
  energy:       Energy storage, grid, renewables
  fintech:      Financial technology
  b2b-saas:     B2B SaaS product
  productivity: Productivity / personal tools

  # ----- Tech -----
  typescript:   TypeScript
  python:       Python
  svelte:       SvelteKit / Svelte
  nextjs:       Next.js
  react:        React
  fastapi:      FastAPI
  mcp:          Model Context Protocol
  postgres:     PostgreSQL
  shell:        Shell / bash scripting

  # ----- Domain (cont.) -----
  education:    Learning / pedagogical product
  docs:         Documentation / strategy / non-code workspace
  simulation:   Physics / numerical simulation
  optimization: Mathematical optimization / scheduling

  # ----- Tech (cont.) -----
  desktop:      Native desktop app (Tauri / Electron)

  # ----- Role / shape -----
  infra:        Infra / DevOps / deployment
  tooling:      Developer tooling / CLI
  library:      Library / SDK / reusable module
  demo:         Demo / showcase
  ui-only:      UI / frontend experiment
  data-only:    Data analysis / notebooks

  # ----- Stage -----
  sandbox:      Experiment / playground / learning
  production:   Deployed and in use
  shelved:      No longer maintained

# Bulk tag assignments. Use to set tags for repos without editing each .md.
# Per-repo frontmatter `tags: [...]` overrides whatever is here.
#
# Example:
#   ontoloom:    [ai, agent, typescript]
#   spritz-svelte: [sandbox, svelte]
assignments: {}
